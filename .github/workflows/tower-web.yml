name: Tower Web Build

on:
  push:
    branches: [main]
    paths:
      - '11_tower/**'
      - '.github/workflows/tower-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.3 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -R /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          godot --version

      - name: Validate Tower project
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --path 11_tower --editor --quit

      - name: Export Tower Web
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p 11_tower/build/web
          godot --headless --path 11_tower --export-release Web build/web/index.html
          test -f 11_tower/build/web/index.html

      - name: Upload Tower Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: redlam7-tower-web
          path: 11_tower/build/web
          if-no-files-found: error
