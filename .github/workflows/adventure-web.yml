name: Adventure Web Build

on:
  push:
    branches: [main]
    paths:
      - '08_adventure/**'
      - '.github/workflows/adventure-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export Adventure for Web
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          relative_project_path: ./08_adventure
          archive_output: true
          cache: true

      - name: Upload Adventure web build
        uses: actions/upload-artifact@v4
        with:
          name: redlam7-adventure-web
          path: 08_adventure/build/web
          if-no-files-found: error
