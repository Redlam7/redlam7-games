name: WilBird Games Web Build

on:
  push:
    branches: [main]
    paths:
      - '08_adventure/**'
      - '11_tower/**'
      - '.github/workflows/adventure-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.3 and export templates
        shell: bash
        run: |
          set -euxo pipefail
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -R /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          godot --version

      - name: Validate games
        shell: bash
        run: |
          set -euxo pipefail
          godot --headless --path 08_adventure --editor --quit
          godot --headless --path 11_tower --editor --quit

      - name: Export games Web
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf site
          mkdir -p site/tower
          mkdir -p 08_adventure/build/web 11_tower/build/web
          godot --headless --path 08_adventure --export-release Web build/web/index.html
          godot --headless --path 11_tower --export-release Web build/web/index.html
          cp -R 08_adventure/build/web/. site/
          cp -R 11_tower/build/web/. site/tower/
          test -f site/index.html
          test -f site/tower/index.html

      - name: Upload downloadable Tower build
        uses: actions/upload-artifact@v4
        with:
          name: redlam7-tower-web
          path: 11_tower/build/web
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy WilBird games to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
